
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nairobi School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Welcome to Nairobi School</h1>
        <p>We would love to hear from you.</p>
    </header>

    <!-- Contact Section -->
    <main class="contact-container">

        <!-- Left Panel: Image and Contact Information -->
        <section class="contact-info">

            <img src="image.png"
                 alt="Nairobi School students"
                 class="students-image">

            <h2>Get in Touch</h2>

            <p>
                <strong>Email:</strong>
                info@nairobischool.edu
            </p>

            <p>
                <strong>Phone:</strong>
                +254 123 456 789
            </p>

            <p>
                <strong>Address:</strong>
                123 Main Street, Nairobi, Kenya
            </p>

        </section>

        <!-- Right Panel: Contact Form -->
        <section class="contact-form">

            <form action="#" method="post">

                <label for="fullname">Full Name:</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                ></textarea>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

</body>
</html>
